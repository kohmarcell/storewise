# Configuration for stale issues and pull requests
# Number of days of inactivity before an issue or pull request becomes stale
daysUntilStale: 60

# Number of days of inactivity before a stale issue or pull request is closed
daysUntilClose: 7

# Issues or pull requests with these labels will never be considered stale
exemptLabels:
  - "pinned"
  - "security"
  - "help wanted"
  - "good first issue"

# Label to use when marking an issue or pull request as stale
staleLabel: "stale"

# Comment to post when marking an issue or pull request as stale.
# Set to `false` to disable
markComment: >
  This issue/pull request has been automatically marked as stale because it has not had
  recent activity. It will be closed if no further activity occurs. Thank you for your
  contributions.

# Comment to post when closing a stale issue or pull request.
# Set to `false` to disable
closeComment: >
  This issue/pull request has been automatically closed due to inactivity.
  If you feel this is a mistake, please feel free to reopen it.

# Limit to only `issues` or `pulls`
# only: issues

# Limit to only issues or pull requests with these labels
# onlyLabels:
#   - "bug"

# Issues or pull requests with these labels will never be considered stale
# exemptLabels:
#   - "pin"

# Set to true to ignore issues in a milestone (defaults to false)
# exemptMilestones: true

# Set to true to ignore issues with an assignee (defaults to false)
# exemptAssignees: true

# Label to use when marking as stale
# staleLabel: "stale"

# Limit the number of actions per hour, from 1-30.
# Default is 30
# limitPerRun: 6

# Limit to only `issues` or `pulls`
# only: issues

# Optionally, specify configuration settings that are specific to just 'issues' or 'pulls':
# pulls:
#   daysUntilStale: 30
#   markComment: >
#     This pull request has been automatically marked as stale because it has not had
#     recent activity. It will be closed if no further activity occurs. Thank you for
#     your contributions.
#   staleLabel: "stale"
#   closeComment: >
#     This pull request has been automatically closed due to inactivity. If you feel this
#     is a mistake, please feel free to reopen it.

# issues:
#   exemptLabels:
#     - "confirmed"