version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: storewise-postgres
    environment:
      POSTGRES_DB: storewise
      POSTGRES_USER: storewise
      POSTGRES_PASSWORD: storewise123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - storewise-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storewise"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: storewise-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - storewise-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: ./apps/api/Dockerfile.dev
    container_name: storewise-api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://storewise:storewise123@postgres:5432/storewise
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: your-super-secret-access-key-min-32-chars-long
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-min-32-chars
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
      - /app/node_modules
    networks:
      - storewise-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: pnpm dev:api

  web:
    build:
      context: ..
      dockerfile: ./apps/web/Dockerfile.dev
    container_name: storewise-web
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
      VITE_APP_NAME: StoreWise
      VITE_APP_VERSION: 1.0.0
      VITE_ENABLE_MOCK_API: false
    volumes:
      - ../apps/web:/app/apps/web
      - ../packages:/app/packages
      - /app/node_modules
    networks:
      - storewise-network
    depends_on:
      - api
    restart: unless-stopped
    command: pnpm dev:web

volumes:
  postgres_data:
  redis_data:

networks:
  storewise-network:
    driver: bridge